---
name: Tests
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Python on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python from .python-version
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache uv packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Verify faiss-cpu installation
        run: |
          echo "Checking faiss-cpu package..."
          uv run python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'Platform: {sys.platform}')
          try:
              import faiss
              print(f'FAISS module: {faiss}')
              faiss_file = getattr(faiss, \"__file__\", \"no __file__\")
              faiss_version = getattr(faiss, \"__version__\", \"no version\")
              print(f'FAISS file: {faiss_file}')
              print(f'FAISS version: {faiss_version}')
              print(f'Has IndexFlatL2: {hasattr(faiss, \"IndexFlatL2\")}')
              print(f'Has read_index: {hasattr(faiss, \"read_index\")}')
              # Try to actually use it
              idx = faiss.IndexFlatL2(128)
              print(f'Created test index successfully: {idx}')
          except Exception as e:
              print(f'FAISS import/test failed: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "
      - name: Run tests with coverage
        run: uv run pytest
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload test results to Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 30
      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: junit.xml
  test-summary:
    name: Test Summary Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Run pytest with markdown report
        uses: pavelzw/pytest-action@v2
        with:
          verbose: true
          emoji: true
          job-summary: true
          custom-arguments: --cov --cov-report=term-missing
          custom-pytest: uv run pytest
          report-title: Test Report Summary
          click-to-expand: true
